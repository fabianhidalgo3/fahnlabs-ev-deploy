<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emulador Cargador OCPP</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
  <style>
    .vehsel { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .vehfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    .ident { font-size: 12px; color: var(--muted); word-break: break-all; }
    .ident b { color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <header class="top">
    <h1>🔌 Emulador de <span>cargador</span> OCPP 1.6J</h1>
    <span class="pill"><span id="wsDot" class="dot off"></span><span id="wsText">Desconectado</span></span>
    <nav><a id="dashLink" href="#" target="_blank">Dashboard ↗</a></nav>
  </header>

  <main>
    <section class="grid two">
      <div class="card">
        <h2>Punto de carga</h2>
        <form id="cpForm" class="form">
          <label style="grid-column:1/-1">URL del CSMS<input name="url" /></label>
          <label>ChargePoint ID<input name="cpId" /></label>
          <label>Fabricante<input name="vendor" value="EmuCharge" /></label>
          <label>Modelo<input name="model" value="AC-Web" /></label>
          <label>Pot. máx. por conector (kW)<input name="maxKw" type="number" step="0.1" value="22" /></label>
          <label>Conectores
            <select name="connectors"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
          </label>
          <label>Fases<select name="phases"><option>1</option><option selected>3</option></select></label>
          <label>Intervalo MeterValues (s)<input name="meterInterval" type="number" min="1" value="5" /></label>
          <label>Aceleración de tiempo<select name="speed"><option value="1">x1</option><option value="10" selected>x10</option><option value="60">x60</option></select></label>
          <button class="primary" id="btnConnect" type="submit">Conectar</button>
        </form>
      </div>
      <div class="card">
        <h2>Tráfico OCPP</h2>
        <div class="log" id="log" style="max-height:260px"></div>
      </div>
    </section>

    <section class="grid chargers" id="connectors"></section>
  </main>

  <script type="module" src="emulator.js"></script>
</body>
</html>
